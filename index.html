<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint Tracker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 -apple-system, Segoe UI, Arial, sans-serif; background: #f4f5f7; color: #222; }
  header { background: #1f2a44; color: #fff; padding: 12px 16px; }
  main { max-width: 640px; margin: 0 auto; padding: 14px; }
  section { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #1f2a44; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .row:last-child { border-bottom: none; }
  .grow { flex: 1; min-width: 0; word-break: break-word; }
  .meta { color: #777; font-size: 12px; }
  .count { font-weight: 700; }
  .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
  a { color: #1f2a44; }
  .muted { color: #777; font-size: 14px; }
  .status { color: #ccd; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <strong>Paint Tracker</strong>
  <div class="status" id="status">Loading...</div>
</header>

<main>
  <section>
    <h2>Favorites</h2>
    <div id="favs"></div>
  </section>

  <section>
    <h2>Today</h2>
    <div id="today"></div>
  </section>

  <section>
    <h2>All time</h2>
    <div id="usage"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};

function render(data) {
  const favs = Object.values(data.favorites || {})
    .sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
  $("favs").innerHTML = favs.length
    ? favs.map(f => `
      <div class="row">
        ${f.imageUrl ? `<img class="thumb" src="${esc(f.imageUrl)}">` : ""}
        <div class="grow">
          <a href="${esc(f.url || "#")}" target="_blank" rel="noopener">${esc(f.name)}</a>
          <div class="meta">${esc(f.manufacturer)}${f.variantNumber ? "" : " (base)"}</div>
        </div>
      </div>`).join("")
    : `<div class="muted">No favorites yet</div>`;

  const daily = Object.entries((data.daily || {})[todayKey()] || {}).sort((a, b) => b[1] - a[1]);
  $("today").innerHTML = daily.length
    ? daily.map(([code, n]) => `<div class="row"><span class="grow">${esc(code)}</span><span class="count">${n}x</span></div>`).join("")
    : `<div class="muted">Nothing used today</div>`;

  const usage = Object.entries(data.usage || {}).sort((a, b) => b[1] - a[1]);
  $("usage").innerHTML = usage.length
    ? usage.map(([code, n]) => `<div class="row"><span class="grow">${esc(code)}</span><span class="count">${n}x</span></div>`).join("")
    : `<div class="muted">No usage tracked yet</div>`;
}

async function load() {
  try {
    // Cache-busting so the phone always gets the latest file
    const res = await fetch("data.json?ts=" + Date.now(), { cache: "no-store" });
    if (res.status === 404) {
      $("status").textContent = "No data yet. Use the Autokote site first.";
      return render({});
    }
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    render(data);
    $("status").textContent = "Updated " + new Date(data.updatedAt).toLocaleString();
  } catch (e) {
    $("status").textContent = "Could not load data.json";
  }
}

load();
setInterval(load, 60000);   // refresh every minute while the page is open
</script>
</body>
</html>
