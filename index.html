<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Paint Tracker</title>
<style>
  :root {
    --bg: #eef0f4; --surface: #fff; --surface2: #f6f7f9; --text: #161b26; --muted: #6b7384;
    --line: #e3e6ec; --accent: #2f5bea; --accent-soft: #e8edfd; --danger: #d93a2f; --ok: #1e8a4c;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1118; --surface: #171b25; --surface2: #1e2331; --text: #eef0f6; --muted: #8b93a7;
      --line: #272d3c; --accent: #6b8cff; --accent-soft: #212a4a; --danger: #ff6b5e; --ok: #4cc983;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

  .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px; border-bottom: 1px solid var(--line); }
  .top-in { max-width: 680px; margin: 0 auto; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .logo { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    background: conic-gradient(from 200deg, #ff6b5e, #ffb347, #4cc983, #4aa8ff, #9b6bff, #ff6b5e); }
  .sync { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .dot.bad { background: var(--danger); }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); width: 32px; height: 32px;
    border-radius: 10px; cursor: pointer; font-size: 16px; line-height: 1; }
  .icon-btn:active { transform: scale(.95); }

  .tabs { display: flex; gap: 4px; margin-top: 12px; padding: 4px; background: var(--surface2);
    border: 1px solid var(--line); border-radius: 12px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600;
    padding: 8px 6px; border-radius: 9px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .tabs button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .tabs .n { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 1px 7px; }

  main { max-width: 680px; margin: 0 auto; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .summary { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 22px; letter-spacing: -.02em; }
  .stat span { color: var(--muted); font-size: 12px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px;
    box-shadow: var(--shadow); overflow: hidden; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px;
    background: var(--surface2); border-bottom: 1px solid var(--line); }
  .card-h h3 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .pill { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }

  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .thumb { width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0; overflow: hidden; position: relative;
    background: var(--surface2); border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; }
  .code { font-weight: 650; word-break: break-word; display: flex; align-items: center; gap: 6px; }
  .code img { width: 16px; height: 16px; flex-shrink: 0; }
  .code a { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--muted); }
  .desc { color: var(--muted); font-size: 13px; word-break: break-word; }
  .count { font-size: 17px; font-weight: 750; letter-spacing: -.01em; min-width: 38px; text-align: right; }
  .count small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 1px; }

  .group-title { display: flex; align-items: center; gap: 12px; padding: 10px 14px 4px; }
  .group-title .code { font-size: 15px; }
  .variant { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 74px; font-size: 14px; color: var(--muted); }
  .variant img { width: 14px; height: 14px; }
  .variant a { color: var(--text); text-decoration: none; border-bottom: 1px dashed var(--muted); }
  .group { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .group:last-child { border-bottom: 0; }

  .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--surface);
    border: 1px dashed var(--line); border-radius: 16px; }
  .empty big { display: block; font-size: 28px; margin-bottom: 4px; }

  details.manage { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  details.manage summary { cursor: pointer; padding: 13px 16px; font-weight: 650; color: var(--muted); list-style: none; }
  details.manage summary::-webkit-details-marker { display: none; }
  details.manage[open] summary { border-bottom: 1px solid var(--line); }
  .manage-body { padding: 14px 16px; }
  .manage-body p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 10px 0 14px; font-size: 14px; }
  .danger-btn { background: var(--danger); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px;
    font: inherit; font-weight: 650; cursor: pointer; }
  .danger-btn:disabled { opacity: .5; cursor: default; }
  .link-btn { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline;
    cursor: pointer; margin-left: 12px; }
  #clearMsg { margin-top: 10px; font-size: 13px; }
  .ok { color: var(--ok); } .err { color: var(--danger); }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <h1><span class="logo"></span>Paint Tracker</h1>
    <div class="sync"><span class="dot" id="dot"></span><span id="status">Loading…</span>
      <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh">↻</button></div>
  </div>
  <nav class="tabs" role="tablist">
    <button data-tab="favs">Favorites <span class="n" id="nFavs">0</span></button>
    <button data-tab="today" class="on">Today <span class="n" id="nToday">0</span></button>
    <button data-tab="all">All time <span class="n" id="nAll">0</span></button>
  </nav>
</div></header>

<main>
  <div id="view"></div>

  <details class="manage">
    <summary>Manage data</summary>
    <div class="manage-body">
      <p>Clears usage counts (today and all time) in data.json on GitHub. Every device running the userscript refreshes from it on its next sync.</p>
      <label class="check"><input type="checkbox" id="clearFavs"> Also clear favorites</label>
      <button class="danger-btn" id="clearBtn">Clear data</button>
      <button class="link-btn" id="forgetToken">Forget saved token</button>
      <div id="clearMsg"></div>
    </div>
  </details>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const imgSrc = url => !url ? null : (url.startsWith("http") ? url : `https://colors.autokotesystems.com${url}`);
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};

const OWNER = "iamGaven", REPO = "atk-tracker", BRANCH = "main", FILE = "data.json";
const DATA_URL = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FILE}`;
const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
const TOKEN_KEY = "paintTrackerGithubToken";

let holdUntil = 0;      // after a clear without a token, ignore the cached raw file for a while
let lastData = {};
let tab = "today";

/* ---------- rendering ---------- */

const thumb = url => {
  const src = imgSrc(url);
  return `<span class="thumb">${src ? `<img src="${esc(src)}" loading="lazy" alt="" onerror="this.remove()">` : ""}</span>`;
};
const descIcon = url => { const s = imgSrc(url); return s ? `<img src="${esc(s)}" alt="" onerror="this.remove()">` : ""; };

// "CHE85:50T (Summit White)" -> ["CHE85:50T", "Summit White"]
function splitName(name) {
  const m = String(name).match(/^(.*?)\s*\((.{2,})\)\s*$/);
  return m ? [m[1], m[2]] : [String(name), ""];
}

// Link to the color's formula page, like favorites have. Uses the stored url when there is one,
// otherwise rebuilds it from the color id and variant in the image url.
function formulaUrl(m, favorites) {
  if (m.url) return m.url;
  const id = m.marketColorId;
  if (!id) return null;
  const variant = ((m.imageUrl || "").match(/variantNumber=(\d+)/i) || [])[1] || "1";
  const fav = Object.values(favorites || {}).find(f => f.marketColorId === id && f.url);
  if (fav) return fav.url.replace(/\/[^/]+\/[^/]+$/, `/${id}/${variant}`);
  return `https://colors.autokotesystems.com/formula/marketcolor/Automotive/ATK/370/${id}/${variant}`;
}

const empty = (icon, text) => `<div class="empty"><big>${icon}</big>${esc(text)}</div>`;

function summaryHtml(items) {
  const uses = items.reduce((a, [, n]) => a + n, 0);
  return `<div class="summary">
    <div class="stat"><b>${uses}</b><span>total uses</span></div>
    <div class="stat"><b>${items.length}</b><span>colors</span></div></div>`;
}

function renderUsage(entries, meta, emptyText, favorites) {
  if (!entries.length) return empty("🎨", emptyText);
  const groups = {};
  entries.forEach(([name, n]) => {
    const m = (meta || {})[name] || {};
    const mfr = m.manufacturer || "Unknown";
    const g = groups[mfr] || (groups[mfr] = { total: 0, items: [] });
    g.total += n;
    g.items.push({ name, n, m });
  });
  const cards = Object.entries(groups)
    .sort((a, b) => b[1].total - a[1].total || a[0].localeCompare(b[0]))
    .map(([mfr, g]) => {
      const rows = g.items.sort((a, b) => b.n - a.n).map(({ name, n, m }) => {
        const [code, desc] = splitName(name);
        const link = formulaUrl(m, favorites);
        const label = link
          ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(code)}</a>`
          : esc(code);
        return `<div class="item">${thumb(m.imageUrl)}
          <div class="info"><div class="code">${descIcon(m.descriptorIcon)}<span>${label}</span></div>
          ${desc ? `<div class="desc">${esc(desc)}</div>` : ""}</div>
          <div class="count">${n}<small>×</small></div></div>`;
      }).join("");
      return `<section class="card"><div class="card-h"><h3>${esc(mfr)}</h3><span class="pill">${g.total}×</span></div>${rows}</section>`;
    }).join("");
  return summaryHtml(entries) + cards;
}

function renderFavs(favorites) {
  const entries = Object.entries(favorites || {});
  if (!entries.length) return empty("⭐", "No favorites yet");

  const byMfr = {};
  entries.forEach(([key, f]) => {
    const mfr = f.manufacturer || "Unknown";
    const id = f.marketColorId || key;
    const groups = byMfr[mfr] || (byMfr[mfr] = {});
    (groups[id] || (groups[id] = { baseName: f.baseName || f.name, imageUrl: null, variants: [] })).variants.push(f);
  });
  Object.values(byMfr).forEach(groups => Object.values(groups).forEach(g => {
    const base = g.variants.find(f => !f.variantNumber);
    if (base) { g.baseName = base.baseName || base.name || g.baseName; g.imageUrl = base.imageUrl || null; }
    if (!g.imageUrl) g.imageUrl = (g.variants.find(f => f.imageUrl) || {}).imageUrl || null;
  }));

  return Object.keys(byMfr).sort().map(mfr => {
    const groups = byMfr[mfr];
    const body = Object.keys(groups)
      .sort((a, b) => groups[a].baseName.localeCompare(groups[b].baseName))
      .map(id => {
        const g = groups[id];
        const [code, desc] = splitName(g.baseName);
        const variants = g.variants
          .sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0))
          .map(f => {
            const label = f.variantNumber ? f.name : `${f.name} (base)`;
            const link = f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label);
            return `<div class="variant">${descIcon(f.descriptorIcon)}${link}</div>`;
          }).join("");
        return `<div class="group"><div class="group-title">${thumb(g.imageUrl)}
          <div class="info"><div class="code"><span>${esc(code)}</span></div>${desc ? `<div class="desc">${esc(desc)}</div>` : ""}</div></div>${variants}</div>`;
      }).join("");
    const total = Object.values(groups).reduce((a, g) => a + g.variants.length, 0);
    return `<section class="card"><div class="card-h"><h3>${esc(mfr)}</h3><span class="pill">${total}</span></div>${body}</section>`;
  }).join("");
}

function render(data) {
  lastData = data || {};
  const meta = lastData.colorMeta || {};
  const today = Object.entries((lastData.daily || {})[todayKey()] || {}).sort((a, b) => b[1] - a[1]);
  const all = Object.entries(lastData.usage || {}).sort((a, b) => b[1] - a[1]);

  $("nFavs").textContent = Object.keys(lastData.favorites || {}).length;
  $("nToday").textContent = today.length;
  $("nAll").textContent = all.length;

  $("view").innerHTML =
    tab === "favs" ? renderFavs(lastData.favorites) :
    tab === "today" ? renderUsage(today, meta, "Nothing used today", lastData.favorites) :
    renderUsage(all, meta, "No usage tracked yet", lastData.favorites);
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  render(lastData);
}));

/* ---------- loading ---------- */

const utf8ToB64 = str => btoa(unescape(encodeURIComponent(str)));
const b64ToUtf8 = b64 => decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));

function setStatus(text, bad) {
  $("status").textContent = text;
  $("dot").classList.toggle("bad", !!bad);
}

async function load() {
  let token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (!token && Date.now() < holdUntil) return;
  try {
    let data = null;
    if (token) {   // the API is never stale, so a clear shows up immediately
      try {
        const res = await fetch(`${API_URL}?ref=${BRANCH}&ts=${Date.now()}`, {
          headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" },
          cache: "no-store"
        });
        if (res.ok) data = JSON.parse(b64ToUtf8((await res.json()).content));
      } catch (e) {}
    }
    if (!data) {
      const res = await fetch(DATA_URL + "?ts=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    }
    render(data);
    const t = new Date(data.updatedAt);
    setStatus("Updated " + (isNaN(t) ? "" : t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })));
  } catch (e) {
    setStatus("Could not load data", true);
  }
}

/* ---------- clear data (writes to GitHub) ---------- */

function getToken() {
  let token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (!token) {
    token = prompt(`Enter a GitHub personal access token with Contents: read & write access to ${OWNER}/${REPO}.\n\nIt will be saved in this browser only.`);
    if (token) {
      token = token.trim();
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    }
  }
  return token;
}

function setMsg(text, cls) { const el = $("clearMsg"); el.textContent = text; el.className = cls || ""; }

async function clearData() {
  const alsoFavs = $("clearFavs").checked;
  const ok = confirm(alsoFavs
    ? "Are you sure?\n\nThis will permanently erase ALL usage counts AND ALL favorites from data.json in the GitHub repo, and from every device running the userscript."
    : "Are you sure?\n\nThis will permanently erase ALL usage counts (today and all time) from data.json in the GitHub repo, and from every device running the userscript. Favorites will be kept.");
  if (!ok) return;

  const token = getToken();
  if (!token) { setMsg("Cancelled: no token provided.", "err"); return; }

  const btn = $("clearBtn");
  btn.disabled = true;
  setMsg("Clearing…");
  const headers = { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" };

  try {
    const getRes = await fetch(`${API_URL}?ref=${BRANCH}&ts=${Date.now()}`, { headers, cache: "no-store" });
    if (getRes.status === 401 || getRes.status === 403) {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      throw new Error("Token rejected. It has been forgotten, so try again with a valid one.");
    }
    if (!getRes.ok) throw new Error(`Could not read data.json (${getRes.status})`);
    const file = await getRes.json();

    let current = {};
    try { current = JSON.parse(b64ToUtf8(file.content)); } catch (e) {}

    const cleared = {
      ...current,
      favorites: alsoFavs ? {} : (current.favorites || {}),
      daily: {},
      usage: {},
      colorMeta: {},
      resetId: String(Date.now()),   // queued clicks older than this are discarded by the userscript
      resetFavs: alsoFavs,
      updatedAt: new Date().toISOString()
    };

    const putRes = await fetch(API_URL, {
      method: "PUT",
      headers: { ...headers, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: alsoFavs ? "Clear all data" : "Clear usage data",
        content: utf8ToB64(JSON.stringify(cleared, null, 2)),
        sha: file.sha,
        branch: BRANCH
      })
    });
    if (putRes.status === 401 || putRes.status === 403) {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      throw new Error("Token rejected or lacks write permission. It has been forgotten.");
    }
    if (putRes.status === 409) throw new Error("data.json changed while clearing. Please try again.");
    if (!putRes.ok) throw new Error(`Could not write data.json (${putRes.status})`);

    holdUntil = Date.now() + 5 * 60 * 1000;
    render(cleared);
    setStatus("Cleared just now");
    setMsg("Data cleared. Devices refresh from it on their next sync.", "ok");
  } catch (e) {
    setMsg(e.message || "Something went wrong.", "err");
  } finally {
    btn.disabled = false;
  }
}

$("clearBtn").addEventListener("click", clearData);
$("forgetToken").addEventListener("click", () => {
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  setMsg("Saved token removed.", "ok");
});
$("refresh").addEventListener("click", () => { holdUntil = 0; setStatus("Refreshing…"); load(); });

load();
setInterval(load, 60000);
</script>
</body>
</html>
