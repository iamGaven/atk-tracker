<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Paint Tracker</title>
<style>
  :root {
    --bg: #eef0f4; --surface: #fff; --surface2: #f6f7f9; --text: #161b26; --muted: #6b7384;
    --line: #e3e6ec; --accent: #2f5bea; --accent-soft: #e8edfd; --danger: #d93a2f; --ok: #1e8a4c;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1118; --surface: #171b25; --surface2: #1e2331; --text: #eef0f6; --muted: #8b93a7;
      --line: #272d3c; --accent: #6b8cff; --accent-soft: #212a4a; --danger: #ff6b5e; --ok: #4cc983;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

  .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px; border-bottom: 1px solid var(--line); }
  .top-in { max-width: 680px; margin: 0 auto; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .logo { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    background: conic-gradient(from 200deg, #ff6b5e, #ffb347, #4cc983, #4aa8ff, #9b6bff, #ff6b5e); }
  .sync { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .dot.bad { background: var(--danger); }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); width: 32px; height: 32px;
    border-radius: 10px; cursor: pointer; font-size: 16px; line-height: 1; }
  .icon-btn:active { transform: scale(.95); }

  .tabs { display: flex; gap: 4px; margin-top: 12px; padding: 4px; background: var(--surface2);
    border: 1px solid var(--line); border-radius: 12px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600;
    padding: 8px 4px; border-radius: 9px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .tabs button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .tabs .n { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 1px 7px; }

  main { max-width: 680px; margin: 0 auto; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .summary { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 22px; letter-spacing: -.02em; }
  .stat span { color: var(--muted); font-size: 12px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px;
    box-shadow: var(--shadow); overflow: hidden; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px;
    background: var(--surface2); border-bottom: 1px solid var(--line); }
  .card-h h3 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .pill { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }

  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .thumb { width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0; overflow: hidden; position: relative;
    background: var(--surface2); border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; }
  .code { font-weight: 650; word-break: break-word; display: flex; align-items: center; gap: 6px; }
  .code img { width: 16px; height: 16px; flex-shrink: 0; }
  .code a { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--muted); }
  .desc { color: var(--muted); font-size: 13px; word-break: break-word; }
  .count { font-size: 17px; font-weight: 750; letter-spacing: -.01em; min-width: 38px; text-align: right; }
  .count small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 1px; }
  .sub { padding: 8px 14px; font-size: 13px; color: var(--muted); }
  .warn { color: #b26a00; }

  .mix-details { border-top: 1px solid var(--line); }
  .mix-details summary { cursor: pointer; list-style: none; display: flex; align-items: center;
    justify-content: space-between; padding: 8px 14px 8px 74px; font-size: 13px; color: var(--muted); }
  .mix-details summary::-webkit-details-marker { display: none; }
  .mix-details summary::after { content: "▾"; font-size: 14px; transition: transform .15s; }
  .mix-details[open] summary::after { transform: rotate(180deg); }
  .mix-details .sub { padding: 6px 14px 2px 74px; }
  .mix-details .item { padding-left: 74px; border-bottom: 1px solid var(--line); }
  .mix-details .item:last-child { border-bottom: 0; }
  .mix-details .warn { padding: 6px 14px 10px 74px; }

  .group-title { display: flex; align-items: center; gap: 12px; padding: 10px 14px 4px; }
  .group-title .code { font-size: 15px; }
  .variant { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 74px; font-size: 14px; color: var(--muted); }
  .variant img { width: 14px; height: 14px; }
  .variant a { color: var(--text); text-decoration: none; border-bottom: 1px dashed var(--muted); }
  .group { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .group:last-child { border-bottom: 0; }

  .chart-wrap { padding: 12px 8px 4px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .chart-wrap text { fill: var(--muted); font-size: 12px; font-family: inherit; }
  .chart-wrap .val { fill: var(--text); font-weight: 600; }
  .bar { fill: var(--accent); }
  .bar:hover, .bar:active { opacity: .75; }
  .grid { stroke: var(--line); stroke-width: 1; }

  .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--surface);
    border: 1px dashed var(--line); border-radius: 16px; }
  .empty big { display: block; font-size: 28px; margin-bottom: 4px; }

  details.manage { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  details.manage summary { cursor: pointer; padding: 13px 16px; font-weight: 650; color: var(--muted); list-style: none; }
  details.manage summary::-webkit-details-marker { display: none; }
  details.manage[open] summary { border-bottom: 1px solid var(--line); }
  .manage-body { padding: 14px 16px; }
  .manage-body p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 10px 0 14px; font-size: 14px; }
  .danger-btn { background: var(--danger); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px;
    font: inherit; font-weight: 650; cursor: pointer; }
  .danger-btn:disabled { opacity: .5; cursor: default; }
  .link-btn { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline;
    cursor: pointer; margin-left: 12px; }
  #clearMsg { margin-top: 10px; font-size: 13px; }
  .ok { color: var(--ok); } .err { color: var(--danger); }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <h1><span class="logo"></span>Paint Tracker</h1>
    <div class="sync"><span class="dot" id="dot"></span><span id="status">Loading…</span>
      <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh">↻</button></div>
  </div>
  <nav class="tabs" role="tablist">
    <button data-tab="favs">Favorites <span class="n" id="nFavs">0</span></button>
    <button data-tab="today" class="on">Today <span class="n" id="nToday">0</span></button>
    <button data-tab="stats">Stats <span class="n" id="nStats">0</span></button>
    <button data-tab="all">All time <span class="n" id="nAll">0</span></button>
  </nav>
</div></header>

<main>
  <div id="view"></div>

  <details class="manage">
    <summary>Manage data</summary>
    <div class="manage-body">
      <p>Clears usage counts (today and all time) in data.json on GitHub. Tick the boxes to also clear favorites or confirmed mixes. Paint details, including 1 oz prices, are always kept. Every device running the userscript refreshes from it on its next sync.</p>
      <label class="check"><input type="checkbox" id="clearFavs"> Also clear favorites</label>
      <label class="check"><input type="checkbox" id="clearMixes"> Also clear confirmed mixes</label>
      <button class="danger-btn" id="clearBtn">Clear data</button>
      <button class="link-btn" id="forgetToken">Forget saved token</button>
      <div id="clearMsg"></div>
    </div>
  </details>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const imgSrc = url => !url ? null : (url.startsWith("http") ? url : `https://colors.autokotesystems.com${url}`);
const pad = n => String(n).padStart(2, "0");
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const money = n => "$" + (n || 0).toFixed(2);
const round2 = n => Math.round(n * 100) / 100;
const shortName = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const fmtDay = k => {
  const [y, m, d] = k.split("-");
  return new Date(+y, +m - 1, +d).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
};
const monthLabel = k => {
  const [y, m] = k.split("-");
  return new Date(+y, +m - 1, 1).toLocaleDateString([], { month: "short", year: "2-digit" });
};

const OWNER = "iamGaven", REPO = "atk-tracker", BRANCH = "main", FILE = "data.json";
const DATA_URL = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FILE}`;
const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
const TOKEN_KEY = "paintTrackerGithubToken";

let holdUntil = 0;
let lastData = {};
let tab = "today";

/* ---------- shared rendering ---------- */

const thumb = url => {
  const src = imgSrc(url);
  return `<span class="thumb">${src ? `<img src="${esc(src)}" loading="lazy" alt="" onerror="this.remove()">` : ""}</span>`;
};
const descIcon = url => { const s = imgSrc(url); return s ? `<img src="${esc(s)}" alt="" onerror="this.remove()">` : ""; };

// "CHE85:50T (Summit White)" -> ["CHE85:50T", "Summit White"]
function splitName(name) {
  const m = String(name).match(/^(.*?)\s*\((.{2,})\)\s*$/);
  return m ? [m[1], m[2]] : [String(name), ""];
}

// Link to the color's formula page. Uses the stored url when there is one,
// otherwise rebuilds it from the color id and variant in the image url.
function formulaUrl(m, favorites) {
  if (m.url) return m.url;
  const id = m.marketColorId;
  if (!id) return null;
  const variant = ((m.imageUrl || "").match(/variantNumber=(\d+)/i) || [])[1] || "1";
  const fav = Object.values(favorites || {}).find(f => f.marketColorId === id && f.url);
  if (fav) return fav.url.replace(/\/[^/]+\/[^/]+$/, `/${id}/${variant}`);
  return `https://colors.autokotesystems.com/formula/marketcolor/Automotive/ATK/370/${id}/${variant}`;
}

const empty = (icon, text) => `<div class="empty"><big>${icon}</big>${esc(text)}</div>`;

function summaryHtml(items) {
  const uses = items.reduce((a, [, n]) => a + n, 0);
  return `<div class="summary">
    <div class="stat"><b>${uses}</b><span>total uses</span></div>
    <div class="stat"><b>${items.length}</b><span>colors</span></div></div>`;
}

function renderUsage(entries, meta, emptyText, favorites) {
  if (!entries.length) return emptyText ? empty("🎨", emptyText) : "";
  const groups = {};
  entries.forEach(([name, n]) => {
    const m = (meta || {})[name] || {};
    const mfr = m.manufacturer || "Unknown";
    const g = groups[mfr] || (groups[mfr] = { total: 0, items: [] });
    g.total += n;
    g.items.push({ name, n, m });
  });
  const cards = Object.entries(groups)
    .sort((a, b) => b[1].total - a[1].total || a[0].localeCompare(b[0]))
    .map(([mfr, g]) => {
      const rows = g.items.sort((a, b) => b.n - a.n).map(({ name, n, m }) => {
        const [code, desc] = splitName(name);
        const link = formulaUrl(m, favorites);
        const label = link
          ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(code)}</a>`
          : esc(code);
        return `<div class="item">${thumb(m.imageUrl)}
          <div class="info"><div class="code">${descIcon(m.descriptorIcon)}<span>${label}</span></div>
          ${desc ? `<div class="desc">${esc(desc)}</div>` : ""}</div>
          <div class="count">${n}<small>×</small></div></div>`;
      }).join("");
      return `<section class="card"><div class="card-h"><h3>${esc(mfr)}</h3><span class="pill">${g.total}×</span></div>${rows}</section>`;
    }).join("");
  return summaryHtml(entries) + cards;
}

function renderFavs(favorites) {
  const entries = Object.entries(favorites || {});
  if (!entries.length) return empty("⭐", "No favorites yet");

  const byMfr = {};
  entries.forEach(([key, f]) => {
    const mfr = f.manufacturer || "Unknown";
    const id = f.marketColorId || key;
    const groups = byMfr[mfr] || (byMfr[mfr] = {});
    (groups[id] || (groups[id] = { baseName: f.baseName || f.name, imageUrl: null, variants: [] })).variants.push(f);
  });
  Object.values(byMfr).forEach(groups => Object.values(groups).forEach(g => {
    const base = g.variants.find(f => !f.variantNumber);
    if (base) { g.baseName = base.baseName || base.name || g.baseName; g.imageUrl = base.imageUrl || null; }
    if (!g.imageUrl) g.imageUrl = (g.variants.find(f => f.imageUrl) || {}).imageUrl || null;
  }));

  return Object.keys(byMfr).sort().map(mfr => {
    const groups = byMfr[mfr];
    const body = Object.keys(groups)
      .sort((a, b) => groups[a].baseName.localeCompare(groups[b].baseName))
      .map(id => {
        const g = groups[id];
        const [code, desc] = splitName(g.baseName);
        const variants = g.variants
          .sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0))
          .map(f => {
            const label = f.variantNumber ? f.name : `${f.name} (base)`;
            const link = f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label);
            return `<div class="variant">${descIcon(f.descriptorIcon)}${link}</div>`;
          }).join("");
        return `<div class="group"><div class="group-title">${thumb(g.imageUrl)}
          <div class="info"><div class="code"><span>${esc(code)}</span></div>${desc ? `<div class="desc">${esc(desc)}</div>` : ""}</div></div>${variants}</div>`;
      }).join("");
    const total = Object.values(groups).reduce((a, g) => a + g.variants.length, 0);
    return `<section class="card"><div class="card-h"><h3>${esc(mfr)}</h3><span class="pill">${total}</span></div>${body}</section>`;
  }).join("");
}

/* ---------- today ---------- */

// Today: one list. Each paint appears once under its manufacturer, with its uses and any mixes.
function renderToday(entries, meta, favorites, mixes) {
  const todayMixes = mixes.filter(m => m.day === todayKey());
  if (!entries.length && !todayMixes.length) return empty("🎨", "Nothing used today");

  const paints = {};
  const getPaint = (key, name) => paints[key] || (paints[key] = { key, name, uses: 0, mixes: [] });
  entries.forEach(([name, n]) => { getPaint(name, name).uses = n; });
  todayMixes.forEach(m => {
    const key = m.name || "codes:" + (m.components || []).map(c => c.paint_code).join("+");
    getPaint(key, m.name || null).mixes.push(m);
  });

  const byMfr = {};
  Object.values(paints).forEach(p => {
    const pm = (meta || {})[p.name] || {};
    const mfr = (p.mixes[0] && p.mixes[0].manufacturer) || pm.manufacturer || "Unknown";
    (byMfr[mfr] || (byMfr[mfr] = [])).push(p);
  });

  const totalCost = todayMixes.reduce((a, m) => a + (m.cost || 0), 0);
  const totalUses = entries.reduce((a, [, n]) => a + n, 0);
  const summary = `<div class="summary">
    <div class="stat"><b>${money(totalCost)}</b><span>mixed today</span></div>
    <div class="stat"><b>${totalUses}</b><span>total uses</span></div></div>`;

  const cards = Object.entries(byMfr)
    .sort((a, b) => sumUses(b[1]) - sumUses(a[1]) || a[0].localeCompare(b[0]))
    .map(([mfr, list]) => {
      const rows = list
        .sort((a, b) => b.uses - a.uses || (a.name || "").localeCompare(b.name || ""))
        .map(p => renderPaintRow(p, meta, favorites))
        .join("");
      return `<section class="card">
        <div class="card-h"><h3>${esc(mfr)}</h3><span class="pill">${sumUses(list)}×</span></div>
        ${rows}
      </section>`;
    }).join("");

  return summary + cards;
}

function sumUses(list) {
  return list.reduce((a, p) => a + p.uses, 0);
}

// One paint on the Today tab: plain usage row, or a mix row with a collapsible breakdown
function renderPaintRow(p, meta, favorites) {
  const pm = (meta || {})[p.name] || {};
  const latest = p.mixes[0] || {};
  const img = latest.image || pm.imageUrl || null;
  const link = latest.url || pm.url || formulaUrl(pm, favorites);

  const [code, desc] = p.name
    ? splitName(p.name)
    : [(latest.components || []).map(c => c.paint_code).join(" + "), ""];
  const codeHtml = link
    ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(code)}</a>`
    : esc(code);

  if (!p.mixes.length) {
    return `<div class="item">${thumb(img)}
      <div class="info"><div class="code">${descIcon(pm.descriptorIcon)}<span>${codeHtml}</span></div>
      ${desc ? `<div class="desc">${esc(desc)}</div>` : ""}</div>
      <div class="count">${p.uses}<small>×</small></div></div>`;
  }

  const cost = p.mixes.reduce((a, m) => a + (m.cost || 0), 0);
  const grams = p.mixes.reduce((a, m) => a + (m.grams || 0), 0);
  const mixCount = p.mixes.reduce((a, m) => a + (m.count || 1), 0);
  const times = `${mixCount} mix${mixCount === 1 ? "" : "es"} today · ${grams.toFixed(1)} g`;
  const unpriced = p.mixes.reduce((a, m) => a + (m.unpriced || 0), 0);

  return `<div class="item">${thumb(img)}
      <div class="info"><div class="code"><span>${codeHtml}</span></div>
      ${desc ? `<div class="desc">${esc(desc)}</div>` : ""}
      <div class="desc">${times}</div></div>
      <div class="count">${money(cost)}</div></div>
    <details class="mix-details">
      <summary>Breakdown</summary>
      ${p.mixes.map(mixBreakdown).join("")}
      ${unpriced ? `<div class="sub warn">${unpriced} component(s) not in price list</div>` : ""}
    </details>`;
}

// The layers and components of one confirmed mix, shown inside the breakdown
function mixBreakdown(m) {
  const layers = (m.layers || []).length > 1
    ? `<div class="sub">${m.layers.map(l => `${esc(l.layer)}: ${money(l.cost)}`).join(" · ")}</div>`
    : "";
  const rows = (m.components || []).map(c => `
    <div class="item">
      <div class="info">
        <div class="code"><span>${esc(c.paint_code)}</span></div>
        ${c.name ? `<div class="desc">${esc(c.name)}</div>` : ""}
        <div class="desc">${(c.grams ?? 0).toFixed(1)} g</div>
      </div>
      <div class="count">${c.cost == null ? "n/a" : money(c.cost)}</div>
    </div>`).join("");
  return layers + rows;
}

/* ---------- stats ---------- */

// Gathers every number the Stats tab shows from data.json in one pass
function buildStats(data) {
  const usage = data.usage || {}, daily = data.daily || {}, meta = data.colorMeta || {}, mixes = data.mixes || [];
  const paints = {};
  const paint = name => paints[name] || (paints[name] = {
    name, uses: 0, days: new Set(), firstDay: null, lastDay: null,
    mixes: 0, cost: 0, grams: 0, components: {}, meta: meta[name] || {},
  });

  Object.keys(meta).forEach(name => paint(name));
  Object.entries(usage).forEach(([name, n]) => { paint(name).uses = n; });
  Object.entries(daily).forEach(([day, map]) => {
    Object.keys(map).forEach(name => {
      const p = paint(name);
      p.days.add(day);
      if (!p.firstDay || day < p.firstDay) p.firstDay = day;
      if (!p.lastDay || day > p.lastDay) p.lastDay = day;
    });
  });

  const materials = {}, dayCost = {}, monthCost = {}, yearCost = {}, yearMixes = {};
  let totalCost = 0, totalGrams = 0, totalMixes = 0;

  mixes.forEach(m => {
    const n = m.count || 1;
    const cost = m.cost || 0;
    totalCost += cost; totalGrams += m.grams || 0; totalMixes += n;

    const day = m.day || "";
    if (day) {
      dayCost[day] = (dayCost[day] || 0) + cost;
      const mk = day.slice(0, 7), yr = day.slice(0, 4);
      monthCost[mk] = (monthCost[mk] || 0) + cost;
      yearCost[yr] = (yearCost[yr] || 0) + cost;
      yearMixes[yr] = (yearMixes[yr] || 0) + n;
    }

    (m.components || []).forEach(c => {
      const mat = materials[c.paint_code] || (materials[c.paint_code] = { code: c.paint_code, name: c.name || "", grams: 0, cost: 0 });
      mat.grams += c.grams || 0;
      mat.cost += c.cost || 0;
    });

    if (!m.name) return; // older mixes without a paint name only count toward totals and materials
    const p = paint(m.name);
    p.mixes += n; p.cost += cost; p.grams += m.grams || 0;
    (m.components || []).forEach(c => {
      const cc = p.components[c.paint_code] || (p.components[c.paint_code] = { code: c.paint_code, name: c.name || "", grams: 0, cost: 0 });
      cc.grams += c.grams || 0;
      cc.cost += c.cost || 0;
    });
  });

  const list = Object.values(paints).map(p => {
    const m = p.meta;
    return {
      name: p.name,
      akzoCode: m.akzoCode || p.name.split("(")[0].trim(),
      variantSuffix: m.variantSuffix || "",
      manufacturer: m.manufacturer || "Unknown",
      imageUrl: m.imageUrl || null,
      url: m.url || null,
      uses: p.uses,
      days: p.days.size,
      firstDay: p.firstDay,
      lastDay: p.lastDay,
      mixes: p.mixes,
      cost: round2(p.cost),
      grams: round2(p.grams),
      avgPerMix: p.mixes ? p.cost / p.mixes : null,
      ozCost: m.ozCost ?? null,
      ozAt: m.ozAt ?? null,
      ozHistory: m.ozHistory || [],
      components: Object.values(p.components).sort((a, b) => b.cost - a.cost),
    };
  });

  const byMfr = {};
  list.forEach(p => {
    const g = byMfr[p.manufacturer] || (byMfr[p.manufacturer] = { name: p.manufacturer, uses: 0, mixes: 0, cost: 0, paints: 0 });
    g.uses += p.uses; g.mixes += p.mixes; g.cost += p.cost; g.paints += 1;
  });

  const matList = Object.values(materials).sort((a, b) => b.cost - a.cost);
  const busiest = Object.entries(dayCost).sort((a, b) => b[1] - a[1])[0] || null;

  return {
    list, byMfr, materials: matList, busiest,
    monthCost, yearCost, yearMixes,
    totalCost, totalGrams, totalMixes,
    totalUses: Object.values(usage).reduce((a, n) => a + n, 0),
    paintsUsed: list.filter(p => p.uses > 0).length,
    activeDays: Object.keys(daily).filter(d => Object.keys(daily[d]).length).length,
  };
}

// Horizontal bars: one row per paint, scaled to the largest value
function hbarChartSvg(rows, fmt) {
  if (!rows.length) return "";
  const W = 440, rowH = 26, labelW = 150, valW = 80, padT = 4;
  const H = padT + rows.length * rowH + 4;
  const barMax = W - labelW - valW;
  const max = Math.max(...rows.map(r => r.value), 0.01);
  const body = rows.map((r, i) => {
    const y = padT + i * rowH;
    const w = Math.max(2, (r.value / max) * barMax);
    return `<text x="${labelW - 6}" y="${y + 17}" text-anchor="end">${esc(shortName(r.label, 22))}</text>
      <rect class="bar" x="${labelW}" y="${y + 5}" width="${w.toFixed(1)}" height="14" rx="3"><title>${esc(r.label)}: ${esc(fmt(r.value))}</title></rect>
      <text class="val" x="${(labelW + w + 5).toFixed(1)}" y="${y + 17}">${esc(fmt(r.value))}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${body}</svg>`;
}

// Vertical bars for a time series
function barChartSvg(items, fmt) {
  if (!items.length) return "";
  const W = 420, H = 200, padL = 42, padR = 8, padT = 10, padB = 28;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const max = Math.max(...items.map(i => i.value), 0.01);
  const niceMax = Math.ceil(max / 5) * 5 || 5;

  const grid = [0, 0.5, 1].map(f => {
    const y = padT + innerH - f * innerH;
    return `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>
      <text x="${padL - 4}" y="${y + 4}" text-anchor="end">$${Math.round(niceMax * f)}</text>`;
  }).join("");

  const slot = innerW / items.length;
  const barW = Math.max(4, Math.min(36, slot * 0.7));
  const every = Math.ceil(items.length / 6);
  const bars = items.map((it, i) => {
    const h = (it.value / niceMax) * innerH;
    const x = padL + i * slot + (slot - barW) / 2;
    const y = padT + innerH - h;
    const lbl = i % every === 0
      ? `<text x="${(x + barW / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle">${esc(it.label)}</text>`
      : "";
    return `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h, 0).toFixed(1)}" rx="3"><title>${esc(it.label)}: ${esc(fmt(it.value))}</title></rect>${lbl}`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${bars}</svg>`;
}

const nameLink = p => {
  const t = esc(p.name);
  return p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${t}</a>` : t;
};

// One paint on the Stats tab, with its details tucked in a breakdown
function renderStatPaint(p) {
  const perOz = p.ozCost != null ? `${money(p.ozCost)}/oz` : "1 oz price pending";
  const sub = `${p.uses} use${p.uses === 1 ? "" : "s"} · ${p.mixes} mix${p.mixes === 1 ? "" : "es"} · ${money(p.cost)} total · ${perOz}`;
  const dates = p.firstDay
    ? `First ${fmtDay(p.firstDay)} · last ${fmtDay(p.lastDay)} · ${p.days} day${p.days === 1 ? "" : "s"} active`
    : "";
  const comps = p.components.slice(0, 6).map(c => `
    <div class="item">
      <div class="info"><div class="code"><span>${esc(c.code)}</span></div>
      <div class="desc">${esc(c.name)} · ${c.grams.toFixed(1)} g</div></div>
      <div class="count">${money(c.cost)}</div>
    </div>`).join("");
  const history = p.ozHistory.slice(-5).reverse().map(h =>
    `<div class="sub">${fmtDay(h.day)} · ${money(h.cost)}/oz</div>`).join("");

  return `<div class="item">${thumb(p.imageUrl)}
      <div class="info"><div class="code"><span>${nameLink(p)}</span></div>
      <div class="desc">${esc(p.manufacturer)}${p.variantSuffix ? " · " + esc(p.variantSuffix) : ""}</div>
      <div class="desc">${sub}</div>
      ${dates ? `<div class="desc">${dates}</div>` : ""}</div>
      <div class="count">${money(p.cost)}</div></div>
    <details class="mix-details">
      <summary>Details</summary>
      <div class="sub">Avg per mix ${p.avgPerMix != null ? money(p.avgPerMix) : "—"} · ${p.grams.toFixed(1)} g mixed</div>
      ${comps}
      ${history ? `<div class="sub">1 oz price history</div>${history}` : ""}
    </details>`;
}

function renderStats(data) {
  const s = buildStats(data);
  if (!s.totalMixes && !s.totalUses) return empty("📊", "No stats yet");

  const top = (arr, f) => arr.filter(p => f(p)).sort((a, b) => f(b) - f(a))[0] || null;
  const mostUsed = top(s.list, p => p.uses);
  const mostSpent = top(s.list, p => p.cost);
  const mostMixed = top(s.list, p => p.mixes);
  const mostOz = top(s.list, p => p.ozCost);
  const cheapestOz = s.list.filter(p => p.ozCost).sort((a, b) => a.ozCost - b.ozCost)[0] || null;
  const avgPerMix = s.totalMixes ? s.totalCost / s.totalMixes : 0;

  const statGrid = `<div class="stat-grid">
    <div class="stat"><b>${money(s.totalCost)}</b><span>total spent on mixes</span></div>
    <div class="stat"><b>${s.totalMixes}</b><span>mixes</span></div>
    <div class="stat"><b>${(s.totalGrams / 1000).toFixed(2)} kg</b><span>material mixed</span></div>
    <div class="stat"><b>${money(avgPerMix)}</b><span>avg per mix</span></div>
    <div class="stat"><b>${s.totalUses}</b><span>total uses</span></div>
    <div class="stat"><b>${s.paintsUsed}</b><span>paints used</span></div>
    <div class="stat"><b>${s.activeDays}</b><span>days active</span></div>
    <div class="stat"><b>${s.busiest ? money(s.busiest[1]) : "—"}</b><span>${s.busiest ? "biggest mix day · " + fmtDay(s.busiest[0]) : "biggest mix day"}</span></div>
  </div>`;

  const hl = (label, p, value) => p ? `<div class="item">${thumb(p.imageUrl)}
      <div class="info"><div class="desc">${esc(label)}</div>
      <div class="code"><span>${nameLink(p)}</span></div>
      <div class="desc">${esc(p.manufacturer)}</div></div>
      <div class="count">${value}</div></div>` : "";

  const highlights = `<section class="card"><div class="card-h"><h3>Highlights</h3></div>
    ${hl("Most used", mostUsed, mostUsed ? `${mostUsed.uses}×` : "")}
    ${hl("Most money spent", mostSpent, mostSpent ? money(mostSpent.cost) : "")}
    ${hl("Most mixed", mostMixed, mostMixed ? `${mostMixed.mixes}×` : "")}
    ${hl("Most expensive per oz", mostOz, mostOz ? money(mostOz.ozCost) + "/oz" : "")}
    ${hl("Cheapest per oz", cheapestOz, cheapestOz ? money(cheapestOz.ozCost) + "/oz" : "")}
    ${mostOz ? "" : `<div class="sub">Price per oz appears after a mix page is opened at 1 oz.</div>`}
  </section>`;

  const costRows = s.list.filter(p => p.cost > 0).sort((a, b) => b.cost - a.cost).slice(0, 15)
    .map(p => ({ label: p.name, value: p.cost }));
  const ozRows = s.list.filter(p => p.ozCost).sort((a, b) => b.ozCost - a.ozCost).slice(0, 15)
    .map(p => ({ label: p.name, value: p.ozCost }));

  const costCard = costRows.length
    ? `<section class="card"><div class="card-h"><h3>Total cost per paint</h3><span class="pill">top ${costRows.length}</span></div>
        <div class="chart-wrap">${hbarChartSvg(costRows, money)}</div></section>`
    : "";
  const ozCard = ozRows.length
    ? `<section class="card"><div class="card-h"><h3>Price per oz</h3><span class="pill">${ozRows.length} paints</span></div>
        <div class="chart-wrap">${hbarChartSvg(ozRows, v => money(v) + "/oz")}</div></section>`
    : "";

  const paintRows = s.list
    .filter(p => p.uses || p.mixes || p.ozCost)
    .sort((a, b) => b.cost - a.cost || b.uses - a.uses || a.name.localeCompare(b.name))
    .map(renderStatPaint).join("");
  const paintsCard = paintRows
    ? `<section class="card"><div class="card-h"><h3>All paints</h3><span class="pill">${s.list.filter(p => p.uses || p.mixes || p.ozCost).length}</span></div>${paintRows}</section>`
    : "";

  const monthItems = Object.keys(s.monthCost).sort().map(k => ({ label: monthLabel(k), value: s.monthCost[k] }));
  const yearRows = Object.keys(s.yearCost).sort().reverse().map(y => `
    <div class="item"><div class="info"><div class="code"><span>${y}</span></div>
    <div class="desc">${s.yearMixes[y]} mix${s.yearMixes[y] === 1 ? "" : "es"}</div></div>
    <div class="count">${money(s.yearCost[y])}</div></div>`).join("");
  const monthCard = monthItems.length
    ? `<section class="card"><div class="card-h"><h3>Spend by month</h3></div>
        <div class="chart-wrap">${barChartSvg(monthItems, money)}</div>
        <div class="card-h"><h3>By year</h3></div>${yearRows}</section>`
    : "";

  const mfrRows = Object.values(s.byMfr).sort((a, b) => b.cost - a.cost).map(g => `
    <div class="item"><div class="info"><div class="code"><span>${esc(g.name)}</span></div>
    <div class="desc">${g.paints} paint${g.paints === 1 ? "" : "s"} · ${g.uses} use${g.uses === 1 ? "" : "s"} · ${g.mixes} mix${g.mixes === 1 ? "" : "es"}</div></div>
    <div class="count">${money(g.cost)}</div></div>`).join("");
  const mfrCard = mfrRows
    ? `<section class="card"><div class="card-h"><h3>By manufacturer</h3></div>${mfrRows}</section>`
    : "";

  const matRows = s.materials.slice(0, 15).map(m => `
    <div class="item"><div class="info"><div class="code"><span>${esc(m.code)}</span></div>
    <div class="desc">${esc(m.name)}</div>
    <div class="desc">${m.grams.toFixed(1)} g · ${s.totalCost ? ((m.cost / s.totalCost) * 100).toFixed(1) : "0.0"}% of spend</div></div>
    <div class="count">${money(m.cost)}</div></div>`).join("");
  const matCard = matRows
    ? `<section class="card"><div class="card-h"><h3>Top materials by cost</h3><span class="pill">top ${Math.min(15, s.materials.length)}</span></div>${matRows}</section>`
    : "";

  return statGrid + highlights + costCard + ozCard + paintsCard + monthCard + mfrCard + matCard;
}

/* ---------- render ---------- */

function render(data) {
  lastData = data || {};
  const meta = lastData.colorMeta || {};
  const mixes = lastData.mixes || [];
  const today = Object.entries((lastData.daily || {})[todayKey()] || {}).sort((a, b) => b[1] - a[1]);
  const all = Object.entries(lastData.usage || {}).sort((a, b) => b[1] - a[1]);

  $("nFavs").textContent = Object.keys(lastData.favorites || {}).length;
  $("nToday").textContent = today.length;
  $("nStats").textContent = mixes.reduce((a, m) => a + (m.count || 1), 0);
  $("nAll").textContent = all.length;

  $("view").innerHTML =
    tab === "favs" ? renderFavs(lastData.favorites) :
    tab === "today" ? renderToday(today, meta, lastData.favorites, mixes) :
    tab === "stats" ? renderStats(lastData) :
    renderUsage(all, meta, "No usage tracked yet", lastData.favorites);
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  render(lastData);
}));

/* ---------- loading ---------- */

const utf8ToB64 = str => btoa(unescape(encodeURIComponent(str)));
const b64ToUtf8 = b64 => decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));

function setStatus(text, bad) {
  $("status").textContent = text;
  $("dot").classList.toggle("bad", !!bad);
}

async function load() {
  let token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (!token && Date.now() < holdUntil) return;
  try {
    let data = null;
    if (token) {   // the API is never stale, so a clear shows up immediately
      try {
        const res = await fetch(`${API_URL}?ref=${BRANCH}&ts=${Date.now()}`, {
          headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" },
          cache: "no-store"
        });
        if (res.ok) data = JSON.parse(b64ToUtf8((await res.json()).content));
      } catch (e) {}
    }
    if (!data) {
      const res = await fetch(DATA_URL + "?ts=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    }
    render(data);
    const t = new Date(data.updatedAt);
    setStatus("Updated " + (isNaN(t) ? "" : t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })));
  } catch (e) {
    setStatus("Could not load data", true);
  }
}

/* ---------- clear data (writes to GitHub) ---------- */

function getToken() {
  let token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (!token) {
    token = prompt(`Enter a GitHub personal access token with Contents: read & write access to ${OWNER}/${REPO}.\n\nIt will be saved in this browser only.`);
    if (token) {
      token = token.trim();
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    }
  }
  return token;
}

function setMsg(text, cls) { const el = $("clearMsg"); el.textContent = text; el.className = cls || ""; }

async function clearData() {
  const alsoFavs = $("clearFavs").checked;
  const alsoMixes = $("clearMixes").checked;

  const scope = [
    "usage counts (today and all time)",
    alsoFavs ? "all favorites" : null,
    alsoMixes ? "all confirmed mixes" : null,
  ].filter(Boolean).join(", ");

  const ok = confirm(
    `Are you sure?\n\nThis will permanently erase ${scope} from data.json in the GitHub repo, ` +
    `and from every device running the userscript.` +
    (alsoFavs || alsoMixes ? "" : "\n\nFavorites and mixes will be kept.")
  );
  if (!ok) return;

  const token = getToken();
  if (!token) { setMsg("Cancelled: no token provided.", "err"); return; }

  const btn = $("clearBtn");
  btn.disabled = true;
  setMsg("Clearing…");
  const headers = { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" };

  try {
    const getRes = await fetch(`${API_URL}?ref=${BRANCH}&ts=${Date.now()}`, { headers, cache: "no-store" });
    if (getRes.status === 401 || getRes.status === 403) {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      throw new Error("Token rejected. It has been forgotten, so try again with a valid one.");
    }
    if (!getRes.ok) throw new Error(`Could not read data.json (${getRes.status})`);
    const file = await getRes.json();

    let current = {};
    try { current = JSON.parse(b64ToUtf8(file.content)); } catch (e) {}

    const cleared = {
      ...current,
      favorites: alsoFavs ? {} : (current.favorites || {}),
      mixes: alsoMixes ? [] : (current.mixes || []),
      daily: {},
      usage: {},
      colorMeta: current.colorMeta || {},   // paint details and 1 oz prices stay
      resetId: String(Date.now()),          // queued events older than this are discarded by the userscript
      resetFavs: alsoFavs,
      resetMixes: alsoMixes,
      updatedAt: new Date().toISOString()
    };

    const message =
      alsoFavs && alsoMixes ? "Clear usage, favorites and mixes" :
      alsoFavs ? "Clear usage and favorites" :
      alsoMixes ? "Clear usage and mixes" :
      "Clear usage data";

    const putRes = await fetch(API_URL, {
      method: "PUT",
      headers: { ...headers, "Content-Type": "application/json" },
      body: JSON.stringify({
        message,
        content: utf8ToB64(JSON.stringify(cleared, null, 2)),
        sha: file.sha,
        branch: BRANCH
      })
    });
    if (putRes.status === 401 || putRes.status === 403) {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      throw new Error("Token rejected or lacks write permission. It has been forgotten.");
    }
    if (putRes.status === 409) throw new Error("data.json changed while clearing. Please try again.");
    if (!putRes.ok) throw new Error(`Could not write data.json (${putRes.status})`);

    holdUntil = Date.now() + 5 * 60 * 1000;
    render(cleared);
    setStatus("Cleared just now");
    setMsg("Data cleared. Devices refresh from it on their next sync.", "ok");
  } catch (e) {
    setMsg(e.message || "Something went wrong.", "err");
  } finally {
    btn.disabled = false;
  }
}

$("clearBtn").addEventListener("click", clearData);
$("forgetToken").addEventListener("click", () => {
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  setMsg("Saved token removed.", "ok");
});
$("refresh").addEventListener("click", () => { holdUntil = 0; setStatus("Refreshing…"); load(); });

load();
setInterval(load, 60000);
</script>
