<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint Tracker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 -apple-system, Segoe UI, Arial, sans-serif; background: #f4f5f7; color: #222; }
  header { background: #1f2a44; color: #fff; padding: 12px 16px; }
  main { max-width: 640px; margin: 0 auto; padding: 14px; }
  section { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #1f2a44; margin: 0 0 8px; }
  h3 { font-size: 13px; color: #555; margin: 10px 0 4px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .row:last-child { border-bottom: none; }
  .grow { flex: 1; min-width: 0; word-break: break-word; }
  .meta { color: #777; font-size: 12px; }
  .count { font-weight: 700; }
  .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  .descriptor { width: 16px; height: 16px; vertical-align: middle; flex-shrink: 0; }
  a { color: #1f2a44; }
  .muted { color: #777; font-size: 14px; }
  .status { color: #ccd; font-size: 12px; margin-top: 4px; }
  .color-group { margin-bottom: 10px; }
  .color-group-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .color-group-title { font-weight: 600; font-size: 14px; }
  .variant-row { display: flex; align-items: center; gap: 8px; padding: 5px 0 5px 48px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .variant-row:last-child { border-bottom: none; }
  .mfr-section { margin-bottom: 16px; }

  .danger-zone { border: 1px solid #f0c4c4; }
  .danger-btn { background: #c0392b; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .danger-btn:disabled { opacity: .5; cursor: default; }
  .check { display: flex; align-items: center; gap: 8px; margin: 8px 0 12px; font-size: 14px; }
  .link-btn { background: none; border: 0; color: #777; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; margin-left: 10px; }
  #clearMsg { margin-top: 8px; font-size: 13px; }
  .ok { color: #1e8449; }
  .err { color: #c0392b; }
</style>
</head>
<body>
<header>
  <strong>Paint Tracker</strong>
  <div class="status" id="status">Loading...</div>
</header>

<main>
  <section>
    <h2>Favorites</h2>
    <div id="favs"></div>
  </section>

  <section>
    <h2>Today</h2>
    <div id="today"></div>
  </section>

  <section>
    <h2>All time</h2>
    <div id="usage"></div>
  </section>

  <section class="danger-zone">
    <h2>Clear data</h2>
    <div class="muted">Resets usage counts (today and all time) in data.json on GitHub. Every device running the userscript wipes its local data the next time it syncs.</div>
    <label class="check">
      <input type="checkbox" id="clearFavs"> Also clear favorites
    </label>
    <button class="danger-btn" id="clearBtn">Clear data</button>
    <button class="link-btn" id="forgetToken">Forget saved token</button>
    <div id="clearMsg"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const imgSrc = url => {
  if (!url) return null;
  return url.startsWith("http") ? url : `https://colors.autokotesystems.com${url}`;
};

const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};

const OWNER = "iamGaven";
const REPO = "atk-tracker";
const BRANCH = "main";
const FILE = "data.json";
const DATA_URL = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FILE}`;
const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
const TOKEN_KEY = "paintTrackerGithubToken";

// After a clear, raw.githubusercontent.com may serve stale data for a few minutes.
// Don't let the auto-refresh redraw old data over the cleared view during that time.
let holdUntil = 0;


function renderFavs(favorites) {
  const container = $("favs");
  const entries = Object.entries(favorites || {});
  if (!entries.length) {
    container.innerHTML = `<div class="muted">No favorites yet</div>`;
    return;
  }

  // Group by manufacturer → marketColorId
  const byMfr = {};
  entries.forEach(([key, f]) => {
    const mfr = f.manufacturer || "Unknown";
    if (!byMfr[mfr]) byMfr[mfr] = {};
    const id = f.marketColorId || key;
    if (!byMfr[mfr][id]) byMfr[mfr][id] = { baseName: f.baseName || f.name, imageUrl: null, variants: [] };
    byMfr[mfr][id].variants.push([key, f]);
  });

  // Fill best imageUrl per group
  Object.values(byMfr).forEach(groups => {
    Object.values(groups).forEach(g => {
      const base = g.variants.find(([, f]) => !f.variantNumber);
      if (base) {
        g.baseName = base[1].baseName || base[1].name || g.baseName;
        if (base[1].imageUrl) g.imageUrl = base[1].imageUrl;
      }
      if (!g.imageUrl) {
        const any = g.variants.find(([, f]) => f.imageUrl);
        if (any) g.imageUrl = any[1].imageUrl;
      }
    });
  });

  let html = "";
  Object.keys(byMfr).sort().forEach(mfr => {
    html += `<div class="mfr-section"><h3>${esc(mfr)}</h3>`;
    const groups = byMfr[mfr];
    Object.keys(groups)
      .sort((a, b) => groups[a].baseName.localeCompare(groups[b].baseName))
      .forEach(id => {
        const g = groups[id];
        const src = imgSrc(g.imageUrl);
        html += `<div class="color-group">`;
        html += `<div class="color-group-header">`;
        if (src) html += `<img class="thumb" src="${esc(src)}">`;
        html += `<span class="color-group-title">${esc(g.baseName)}</span>`;
        html += `</div>`;
        g.variants
          .sort((a, b) => (b[1].addedAt || 0) - (a[1].addedAt || 0))
          .forEach(([, f]) => {
            const descSrc = imgSrc(f.descriptorIcon);
            const label = f.variantNumber ? f.name : `${f.name} (base)`;
            const link = f.url
              ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(label)}</a>`
              : esc(label);
            html += `<div class="variant-row">`;
            if (descSrc) html += `<img class="descriptor" src="${esc(descSrc)}" title="Variant type">`;
            html += link;
            html += `</div>`;
          });
        html += `</div>`;
      });
    html += `</div>`;
  });

  container.innerHTML = html;
}

function render(data) {
  renderFavs(data.favorites);

  const daily = Object.entries((data.daily || {})[todayKey()] || {}).sort((a, b) => b[1] - a[1]);
  $("today").innerHTML = daily.length
    ? daily.map(([code, n]) => `<div class="row"><span class="grow">${esc(code)}</span><span class="count">${n}x</span></div>`).join("")
    : `<div class="muted">Nothing used today</div>`;

  const usage = Object.entries(data.usage || {}).sort((a, b) => b[1] - a[1]);
  $("usage").innerHTML = usage.length
    ? usage.map(([code, n]) => `<div class="row"><span class="grow">${esc(code)}</span><span class="count">${n}x</span></div>`).join("")
    : `<div class="muted">No usage tracked yet</div>`;
}

async function load() {
  let token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  // Without a token we can only use the cached raw file, so hold off right after a clear
  if (!token && Date.now() < holdUntil) return;
  try {
    let data = null;
    if (token) {
      // The API is never stale, so a clear shows up immediately
      try {
        const res = await fetch(`${API_URL}?ref=${BRANCH}&ts=${Date.now()}`, {
          headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" },
          cache: "no-store"
        });
        if (res.ok) data = JSON.parse(b64ToUtf8((await res.json()).content));
      } catch (e) {}
    }
    if (!data) {
      const res = await fetch(DATA_URL + "?ts=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    }
    render(data);
    $("status").textContent = "Updated " + new Date(data.updatedAt).toLocaleString();
  } catch (e) {
    $("status").textContent = "Could not load data.json";
  }
}

/* ---------- Clear data (writes to GitHub) ---------- */

const utf8ToB64 = str => btoa(unescape(encodeURIComponent(str)));
const b64ToUtf8 = b64 => decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));

function getToken() {
  let token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (!token) {
    token = prompt(
      "Enter a GitHub personal access token with Contents: read & write access to " +
      `${OWNER}/${REPO}.\n\nIt will be saved in this browser only.`
    );
    if (token) {
      token = token.trim();
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    }
  }
  return token;
}

function setMsg(text, cls) {
  const el = $("clearMsg");
  el.textContent = text;
  el.className = cls || "";
}

async function clearData() {
  const alsoFavs = $("clearFavs").checked;

  // Confirmation popup
  const ok = confirm(
    alsoFavs
      ? "Are you sure?\n\nThis will permanently erase ALL usage counts AND ALL favorites from data.json in the GitHub repo, and from every device running the userscript."
      : "Are you sure?\n\nThis will permanently erase ALL usage counts (today and all time) from data.json in the GitHub repo, and from every device running the userscript. Favorites will be kept."
  );
  if (!ok) return;

  const token = getToken();
  if (!token) { setMsg("Cancelled: no token provided.", "err"); return; }

  const btn = $("clearBtn");
  btn.disabled = true;
  setMsg("Clearing...");

  const headers = {
    "Authorization": `Bearer ${token}`,
    "Accept": "application/vnd.github+json"
  };

  try {
    // Get current file (need its sha, and its favorites if keeping them)
    const getRes = await fetch(`${API_URL}?ref=${BRANCH}&ts=${Date.now()}`, { headers, cache: "no-store" });
    if (getRes.status === 401 || getRes.status === 403) {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      throw new Error("Token rejected. It has been forgotten, so try again with a valid one.");
    }
    if (!getRes.ok) throw new Error(`Could not read data.json (${getRes.status})`);
    const file = await getRes.json();

    let current = {};
    try { current = JSON.parse(b64ToUtf8(file.content)); } catch (e) {}

    const cleared = {
      ...current,
      favorites: alsoFavs ? {} : (current.favorites || {}),
      daily: {},
      usage: {},
      colorMeta: {},
      resetId: String(Date.now()),   // tells the userscript to wipe its local storage
      resetFavs: alsoFavs,           // whether favorites should be wiped too
      updatedAt: new Date().toISOString()
    };

    const putRes = await fetch(API_URL, {
      method: "PUT",
      headers: { ...headers, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: alsoFavs ? "Clear all data" : "Clear usage data",
        content: utf8ToB64(JSON.stringify(cleared, null, 2)),
        sha: file.sha,
        branch: BRANCH
      })
    });
    if (putRes.status === 401 || putRes.status === 403) {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      throw new Error("Token rejected or lacks write permission. It has been forgotten.");
    }
    if (putRes.status === 409) throw new Error("data.json changed while clearing. Please try again.");
    if (!putRes.ok) throw new Error(`Could not write data.json (${putRes.status})`);

    holdUntil = Date.now() + 5 * 60 * 1000;
    render(cleared);
    $("status").textContent = "Cleared " + new Date().toLocaleString();
    setMsg("Data cleared. Devices will wipe their local data on their next sync.", "ok");
  } catch (e) {
    setMsg(e.message || "Something went wrong.", "err");
  } finally {
    btn.disabled = false;
  }
}

$("clearBtn").addEventListener("click", clearData);
$("forgetToken").addEventListener("click", () => {
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  setMsg("Saved token removed.", "ok");
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
